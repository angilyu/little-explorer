# Server tests. Runs on pull requests that touch the server or the books (no secrets), and is called by
# deploy.yml before anything ships.
name: Server tests

on:
  pull_request:
    paths:
      - "server/**"
      - "LittleExplorer/Resources/**"
      - ".github/workflows/server-tests.yml"
      - ".github/workflows/deploy.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      # Test against the pinned versions the agent image ships (requirements.txt), not the newest matches.
      - run: uv venv && uv pip install -r requirements.txt -e . pytest pytest-asyncio
      - run: uv run --no-sync pytest -q
