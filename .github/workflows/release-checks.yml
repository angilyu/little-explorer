# Release checks: scripts/release.sh's guards (one version = one pushed commit; beta and App Store
# builds share version and build number) and the Beta build configuration (bundle ID, name, icon).
# Needs no Xcode or secrets.
name: Release checks

on:
  pull_request:
    paths:
      - "scripts/release.sh"
      - "scripts/testflight.sh"
      - "scripts/tests/**"
      - "Config/**"
      - "LittleExplorer.xcodeproj/**"
      - "LittleExplorer/Assets.xcassets/AppIcon*/**"
      - ".github/workflows/release-checks.yml"

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: shellcheck scripts/release.sh scripts/testflight.sh
      - run: uv run --no-project --with pytest pytest -q scripts/tests
