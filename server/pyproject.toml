[project]
name = "little-explorer-agent"
version = "0.1.0"
description = "Pip, the patient voice buddy for the Little Explorer picture books (LiveKit + voice-kit)"
requires-python = ">=3.12"
dependencies = [
    "voice-kit[livekit,openai,tokens] @ git+https://github.com/angilyu/voice-kit@309c363",
    "livekit-plugins-openai~=1.8",
    "langgraph>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/little_explorer_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
