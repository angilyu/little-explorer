[project]
name = "little-explorer-agent"
version = "0.1.0"
description = "Pip, the patient voice buddy for the Little Explorer picture books (LiveKit Agents + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[langchain,openai]~=1.8",
    "livekit-plugins-noise-cancellation>=0.2",
    "livekit-api>=1.0",
    "langchain[openai]>=1.4",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/little_explorer_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
